name: CI

# Until this workflow existed, nothing in CI ran a test, a build, or a config
# check. The repository's only workflow pushed JSON at production. A green
# repository therefore meant nothing: the contact-api suite could go red, the
# site could stop building, and docker/apache/httpd.conf or the edge blocks in
# docs/CADDY-INTEGRATION.md could stop parsing, all without a signal.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contact-api-tests:
    name: contact-api test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/contact-api/package-lock.json

      - name: Install dependencies
        working-directory: services/contact-api
        run: npm ci

      # The suite starts a real child-process server and drives it over HTTP.
      - name: Run tests
        working-directory: services/contact-api
        run: npm test

  dashboard-api-tests:
    name: dashboard-api test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` — this service has zero dependencies and no
          # package-lock.json for the cache key to hash.

      # The service that owns the dashboard_data volume's write path. Its
      # 40-case suite (seeding, corrupt-feed quarantine, CAS conflicts, audit
      # rotation, shutdown draining) existed since mid-August but was run by
      # nothing: mcp-connector-tests.yml *triggers* on this path yet only runs
      # the connector's own tests.
      - name: Run tests
        working-directory: services/dashboard-api
        run: npm test

  office-mail-mcp-tests:
    name: Office & Mail MCP test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Zero-dependency packages (tools/mcp): no lockfiles, nothing to cache.

      - name: office-mcp tests
        working-directory: tools/mcp/office-mcp
        run: npm test

      - name: mail-mcp tests
        working-directory: tools/mcp/mail-mcp
        run: npm test

  build:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # `build` also runs the postbuild step (terser on the service worker plus
      # the unused-image prune), so this covers the whole ship path.
      - name: Build the site
        run: npm run build

      - name: Check the build produced the expected entry points
        run: |
          set -euo pipefail
          for f in dist/index.html dist/404.html dist/robots.txt \
                   dist/apps/index.html dist/support/index.html \
                   dist/privacy/index.html dist/terms/index.html \
                   dist/fabrication/index.html dist/3d-lab/index.html \
                   dist/greenhouse/index.html dist/orchard/index.html \
                   dist/contact-received/index.html \
                   dist/office-scout/index.html dist/deals/index.html dist/jobs/index.html; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          echo "build output looks complete"

      # Everything in dist/ is served on the public internet. Until 2026-08-17
      # the build shipped two MCP servers' source, their internal design docs
      # (including a .docx SDD), and the deals agent-state JSON — the operator's
      # postal code, a third party's name, and negotiation records — because
      # nothing asserted what dist/ may contain. Apache now denies .mjs/.docx
      # as a second layer (docker/apache/httpd.conf), but the build failing
      # here is the layer that catches the mistake at PR time.
      - name: Assert the build contains no server source or agent-state files
        run: |
          set -euo pipefail
          bad=0
          hits="$(find dist -name '*.mjs' -o -name '*.docx' -o -name 'package.json' \
                    -o -name 'seller-watch.json' -o -name 'search-profiles.json' \
                    -o -name 'unresolved-listings.json' -o -name 'shipping-calibration.json' \
                    -o -name 'historical-listings.json' | head -20)"
          if [ -n "$hits" ]; then
            echo '::error::dist/ contains files that must never be published:' >&2
            echo "$hits" >&2
            bad=1
          fi
          if [ -d dist/office-scout/mcp ]; then
            echo '::error::dist/office-scout/mcp exists — the MCP tree leaked back into public/' >&2
            bad=1
          fi
          if [ -d dist/deals/data/archive ]; then
            echo '::error::dist/deals/data/archive exists — archived snapshots leaked back into public/' >&2
            bad=1
          fi
          exit "$bad"

      # `astro build` does not type-check. `astro check` covers the .astro
      # components (it caught a real Font-variable type error when first
      # enabled); tsc covers the plain .ts data modules. Both need the build
      # to have run first so .astro/types.d.ts exists.
      - name: Type-check
        run: |
          npx astro check
          npx tsc --noEmit

  edge-config:
    name: Edge and origin configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two config files decide how every request in this system is routed, and
      # both validate in well under a second. httpd.conf + vhost.conf are 470
      # lines; the documented Caddy blocks are ~290. Neither was ever checked.
      - name: Validate the Apache origin configuration
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/docker/apache:/fluxology-conf:ro" httpd:2.4-alpine sh -c '
            cp /fluxology-conf/vhost.conf /usr/local/apache2/conf/extra/vhost.conf &&
            httpd -t -f /fluxology-conf/httpd.conf'

      # docs/CADDY-INTEGRATION.md is the source of truth for the edge, and the
      # edge lives outside this repository — so the one thing CI can do is make
      # sure the config a human is told to copy actually parses. Every drift
      # class at the edge fails OPEN (a 200 with stale or wrong content), so a
      # block that does not even load is the cheapest failure to catch here.
      - name: Extract the documented Caddy blocks
        run: |
          set -euo pipefail
          awk '/^```caddyfile$/{f=1;next} /^```$/{f=0;next} f' \
            docs/CADDY-INTEGRATION.md > caddy-from-doc.Caddyfile
          test -s caddy-from-doc.Caddyfile || {
            echo 'No ```caddyfile blocks found in docs/CADDY-INTEGRATION.md' >&2; exit 1; }
          grep -q 'Strict-Transport-Security' caddy-from-doc.Caddyfile || {
            echo 'The documented edge config no longer sets HSTS. Apache is forbidden' >&2
            echo 'from setting it (see docker/apache/httpd.conf), so nothing would.' >&2; exit 1; }
          grep -Eq '^[[:space:]]*log[[:space:]]*\{' caddy-from-doc.Caddyfile || {
            echo 'The documented edge config no longer has an access log — /api/*' >&2
            echo 'and /data/listings.json would be unlogged everywhere.' >&2; exit 1; }
          wc -l caddy-from-doc.Caddyfile

      - name: Validate the documented Caddy blocks
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/caddy-from-doc.Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Syntax-check the feed-sync helper
        run: bash -n .github/scripts/post-feed.sh

# services/fluxology-mcp's suite is NOT run here — it runs in its own
# workflow, .github/workflows/mcp-connector-tests.yml, together with the
# connector's packaging/deployment invariants. Every other suite in the
# repository runs above; if a new package gains tests, its job belongs in
# this file unless it needs the connector workflow's Docker assertions.
