# Virtual Host Configuration for Fluxology Website
# =============================================================================
# Included from httpd.conf. This container is an INTERNAL ORIGIN behind Caddy:
#
#   * There is exactly one vhost, on the internal port, speaking plain HTTP.
#   * There is no HTTPS vhost and no http->https redirect vhost. Caddy
#     terminates TLS and already performs the redirect, and it is not reachable
#     from anywhere except Caddy, so a second redirect here would be dead
#     config that only invites drift. (The previous commented-out :443 vhost
#     and rewrite vhost were removed for that reason — reinstating them would
#     re-introduce a second Strict-Transport-Security source.)
#   * Strict-Transport-Security is NOT set here. Caddy owns it; see the HSTS
#     note in httpd.conf.
#
# Cache policy, the Content-Security-Policy, and the rest of the security
# headers are defined once at server scope in httpd.conf and inherited by this
# vhost — they are deliberately not duplicated here.
# =============================================================================

<VirtualHost *:6080>
    # Same canonical public origin as httpd.conf, so mod_dir's trailing-slash
    # redirects resolve to https://fluxology.ca/... rather than to the
    # internal http://apache:6080/... that Caddy actually connects to.
    ServerName https://fluxology.ca
    ServerAlias www.fluxology.ca
    ServerAdmin admin@fluxology.ca

    DocumentRoot "/usr/local/apache2/htdocs"

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Branded 404 built by Astro (no SPA rewrite — static site)
    ErrorDocument 404 /404.html

    # Logging. proxy_combined is defined in httpd.conf: first column is the
    # real visitor IP recovered from X-Forwarded-For by mod_remoteip, not
    # Caddy's container address.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 proxy_combined

    # Security headers. These repeat the server-scope values from httpd.conf
    # so the vhost is self-evident; `set` replaces rather than appends, so no
    # header is emitted twice. HSTS is absent by design.
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "0"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</VirtualHost>
