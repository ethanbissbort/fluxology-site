# Apache HTTP Server Configuration for Fluxology Website
# Optimized for serving static Astro site
#
# =============================================================================
# THIS SERVER SITS BEHIND CADDY. It is an internal origin, not an edge.
# =============================================================================
#   * TLS is terminated by Caddy (see caddy/Caddyfile). Apache speaks plain
#     HTTP on the container network only — no mod_ssl, no certificates, no
#     http->https redirect here; Caddy already did both.
#   * Strict-Transport-Security is emitted by CADDY ONLY. Do not add an HSTS
#     header anywhere in this file or in vhost.conf: two layers setting it
#     produces a duplicated header, and the TLS terminator is the layer that
#     is entitled to make the claim.
#   * The port below is NOT published to the host any more (see
#     docker-compose.yml). Only Caddy can reach it, as `apache:6080`.
#   * The real client IP arrives in X-Forwarded-For, set by Caddy. mod_remoteip
#     below restores it so logs and %a show the visitor, not Caddy's container
#     address.

ServerRoot "/usr/local/apache2"
# Internal listen port. Non-default so this container never collides with
# others on the VPS, including under host networking. Caddy proxies to
# apache:6080; nothing outside the compose network can connect here.
Listen 6080

# Load necessary modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule expires_module modules/mod_expires.so
# Required for the RemoteIP* directives below (real client IP behind Caddy).
# Ships with the official httpd:2.4-alpine image.
LoadModule remoteip_module modules/mod_remoteip.so

# Brotli compression. Guarded with <IfFile> so that if the base image ever
# ships without mod_brotli.so, Apache still starts (falling back to gzip).
# The official httpd:2.4-alpine image includes this module.
<IfFile "modules/mod_brotli.so">
  LoadModule brotli_module modules/mod_brotli.so
</IfFile>

# Server Configuration
ServerAdmin admin@fluxology.ca

# ServerName carries an explicit scheme. Apache only ever sees plain HTTP from
# Caddy, so without this any self-referential redirect it generates (most
# commonly mod_dir's trailing-slash redirect, /fabrication -> /fabrication/)
# would come back as http:// and bounce the visitor out of TLS for a round
# trip. Declaring the canonical public origin makes those redirects https://.
# UseCanonicalName On tells Apache to use this value rather than the incoming
# Host header when it builds them. (Caddy also rewrites any stray http://
# Location as a second line of defence — see caddy/Caddyfile.)
ServerName https://fluxology.ca
UseCanonicalName On

# =============================================================================
# REAL CLIENT IP (behind Caddy)
# =============================================================================
# Without this every log line and every access-control decision would see
# Caddy's container address. mod_remoteip replaces the connection's peer
# address with the last untrusted address in X-Forwarded-For, which Caddy sets.
#
# Trust is scoped to private address space: this container is not published to
# the host, so the only thing that can open a connection to it is another
# container on fluxology-network. A request arriving from a public address is
# impossible here, and its X-Forwarded-For would be ignored anyway.
<IfModule remoteip_module>
  RemoteIPHeader X-Forwarded-For
  # Docker's default address pools, plus loopback for in-container checks.
  RemoteIPInternalProxy 172.16.0.0/12
  RemoteIPInternalProxy 192.168.0.0/16
  RemoteIPInternalProxy 10.0.0.0/8
  RemoteIPInternalProxy 127.0.0.0/8
</IfModule>

<IfModule unixd_module>
  User www-data
  Group www-data
</IfModule>

# Security: Disable directory listings and .htaccess
<Directory />
  AllowOverride None
  Require all denied
</Directory>

# Document Root
DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
  Options -Indexes +FollowSymLinks
  AllowOverride None
  Require all granted

  # No SPA rewrite: this is a fully static site with no client-side router.
  # Rewriting unknown URLs to index.html produced soft-404s (HTTP 200 for
  # garbage paths); unknown paths now return a real 404 (see ErrorDocument).
</Directory>

# Default index files
<IfModule dir_module>
  DirectoryIndex index.html
</IfModule>

# Prevent access to .htaccess and other hidden files
<Files ".ht*">
  Require all denied
</Files>

<Files ".*">
  Require all denied
</Files>

<Files "index.html">
  Require all granted
</Files>

# Error and Access Logs
ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
  LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
  LogFormat "%h %l %u %t \"%r\" %>s %b" common

  # Active format. Same fields as "combined", except the first column is %a —
  # the client IP as corrected by mod_remoteip from X-Forwarded-For — instead
  # of %h, which would show Caddy's container address on every single line.
  # `peer=%{c}a` appends the real connection peer (i.e. Caddy) so a
  # misconfigured proxy chain is still diagnosable.
  # Do not log %{X-Forwarded-For}i here: mod_remoteip consumes the header once
  # it has used it, so that field would always render as "-".
  LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" peer=%{c}a" proxy_combined

  CustomLog /proc/self/fd/1 proxy_combined
</IfModule>

# MIME Types
<IfModule mime_module>
  TypesConfig conf/mime.types
  AddType application/javascript .js
  AddType text/css .css
  AddType text/html .html .htm
  AddType image/svg+xml .svg .svgz
  AddType image/webp .webp
  AddType image/avif .avif
  AddType font/woff2 .woff2
  AddType font/woff .woff
  AddType font/ttf .ttf
  AddType font/eot .eot
  AddType application/json .json
  AddType application/manifest+json .webmanifest
  AddEncoding gzip .gz
</IfModule>

# ==============================================
# PERFORMANCE OPTIMIZATIONS
# ==============================================

# Enable HTTP/2 if available
# Protocols h2 h2c http/1.1

# Enable Keep-Alive
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Compression
# Note on the two compression layers: Caddy also compresses (zstd + gzip), but
# its `encode` handler skips any response that already carries a
# Content-Encoding. Caddy forwards the client's Accept-Encoding unchanged, so
# Apache compresses first and Caddy passes the result through untouched — no
# double compression, and browsers still get brotli below, which Caddy cannot
# produce on the fly. Keep this section: it is what makes brotli possible.
<IfModule mod_deflate.c>
  # Compress HTML, CSS, JavaScript, Text, XML and fonts
  AddOutputFilterByType DEFLATE application/javascript
  AddOutputFilterByType DEFLATE application/rss+xml
  AddOutputFilterByType DEFLATE application/vnd.ms-fontobject
  AddOutputFilterByType DEFLATE application/x-font
  AddOutputFilterByType DEFLATE application/x-font-opentype
  AddOutputFilterByType DEFLATE application/x-font-otf
  AddOutputFilterByType DEFLATE application/x-font-truetype
  AddOutputFilterByType DEFLATE application/x-font-ttf
  AddOutputFilterByType DEFLATE application/x-javascript
  AddOutputFilterByType DEFLATE application/xhtml+xml
  AddOutputFilterByType DEFLATE application/xml
  AddOutputFilterByType DEFLATE font/opentype
  AddOutputFilterByType DEFLATE font/otf
  AddOutputFilterByType DEFLATE font/ttf
  AddOutputFilterByType DEFLATE image/svg+xml
  AddOutputFilterByType DEFLATE image/x-icon
  AddOutputFilterByType DEFLATE text/css
  AddOutputFilterByType DEFLATE text/html
  AddOutputFilterByType DEFLATE text/javascript
  AddOutputFilterByType DEFLATE text/plain
  AddOutputFilterByType DEFLATE text/xml

  # Don't compress images, videos, or already compressed files
  SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|avif|mp4|webm|woff2?)$ no-gzip

  # Compression level (1-9, 6 is good balance)
  DeflateCompressionLevel 6
</IfModule>

# Brotli compression — preferred over gzip when the client advertises it.
# Both filters coexist: Apache negotiates by the request's Accept-Encoding,
# serving "br" to capable clients and falling back to mod_deflate's gzip.
# Only text-based types are compressed; woff2 fonts and raster images are
# already compressed and are intentionally omitted.
<IfModule mod_brotli.c>
  AddOutputFilterByType BROTLI_COMPRESS application/javascript
  AddOutputFilterByType BROTLI_COMPRESS application/json
  AddOutputFilterByType BROTLI_COMPRESS application/rss+xml
  AddOutputFilterByType BROTLI_COMPRESS application/xhtml+xml
  AddOutputFilterByType BROTLI_COMPRESS application/xml
  AddOutputFilterByType BROTLI_COMPRESS image/svg+xml
  AddOutputFilterByType BROTLI_COMPRESS image/x-icon
  AddOutputFilterByType BROTLI_COMPRESS text/css
  AddOutputFilterByType BROTLI_COMPRESS text/html
  AddOutputFilterByType BROTLI_COMPRESS text/javascript
  AddOutputFilterByType BROTLI_COMPRESS text/plain
  AddOutputFilterByType BROTLI_COMPRESS text/xml

  # On-the-fly quality (0-11). 5 balances ratio vs CPU for dynamic responses.
  BrotliCompressionQuality 5
</IfModule>

# ==============================================
# CACHING & EXPIRES HEADERS
# ==============================================

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresDefault "access plus 1 month"

  # HTML - short cache (may change frequently)
  ExpiresByType text/html "access plus 0 seconds"

  # CSS and JavaScript - 1 year (use versioning/hashing)
  ExpiresByType text/css "access plus 1 year"
  ExpiresByType application/javascript "access plus 1 year"
  ExpiresByType text/javascript "access plus 1 year"

  # Images - 7 days (matches the Cache-Control max-age=604800 below; images
  # live at unhashed public/ paths, so a 1-year Expires would conflict).
  # Hashed images under /_assets/ get the 1-year immutable Cache-Control via
  # the LocationMatch below, which overrides these.
  ExpiresByType image/jpeg "access plus 7 days"
  ExpiresByType image/jpg "access plus 7 days"
  ExpiresByType image/png "access plus 7 days"
  ExpiresByType image/gif "access plus 7 days"
  ExpiresByType image/webp "access plus 7 days"
  ExpiresByType image/avif "access plus 7 days"
  ExpiresByType image/svg+xml "access plus 7 days"
  ExpiresByType image/x-icon "access plus 7 days"

  # Fonts - 1 year
  ExpiresByType font/woff2 "access plus 1 year"
  ExpiresByType font/woff "access plus 1 year"
  ExpiresByType font/ttf "access plus 1 year"
  ExpiresByType font/eot "access plus 1 year"
  ExpiresByType font/opentype "access plus 1 year"

  # Service Worker - no cache (always fresh)
  <FilesMatch "service-worker\.js$">
    ExpiresActive Off
    Header set Cache-Control "no-cache, no-store, must-revalidate"
  </FilesMatch>
</IfModule>

# Cache-Control headers
<IfModule mod_headers.c>
  # HTML - no cache
  <FilesMatch "\.(html|htm)$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Pragma "no-cache"
    Header set Expires "0"
  </FilesMatch>

  # CSS, JS - immutable (assuming hashed filenames)
  <FilesMatch "\.(css|js)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>

  # Images at unhashed public/ paths (/images/*, favicon.svg, PWA icons, etc.)
  # must stay revalidatable — a year of "immutable" would pin an old logo
  # forever. 7 days is the moderate middle ground. Hashed assets get the
  # 1-year immutable rule via the /_assets/ LocationMatch below.
  <FilesMatch "\.(jpg|jpeg|png|gif|webp|avif|svg|ico)$">
    Header set Cache-Control "public, max-age=604800"
  </FilesMatch>

  # Web app manifest — short cache so icon/name changes propagate
  <FilesMatch "\.webmanifest$">
    Header set Cache-Control "public, max-age=3600"
  </FilesMatch>

  # Fonts
  <FilesMatch "\.(woff2|woff|ttf|eot|otf)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
    Header set Access-Control-Allow-Origin "*"
  </FilesMatch>

  # Service Worker - no cache
  <FilesMatch "service-worker\.js$">
    Header set Cache-Control "no-cache, no-store, must-revalidate"
    Header set Service-Worker-Allowed "/"
  </FilesMatch>
</IfModule>

# Everything under /_assets/ carries a content hash in its filename (CSS, JS,
# fonts, future images) — safe to cache immutably for a year. Path-scoped so
# unhashed public/ files never inherit it.
<LocationMatch "^/_assets/">
  <IfModule mod_headers.c>
    Header set Cache-Control "public, max-age=31536000, immutable"
  </IfModule>
</LocationMatch>

# ==============================================
# SECURITY HEADERS
# ==============================================

<IfModule mod_headers.c>
  # X-Frame-Options: Prevent clickjacking
  Header always set X-Frame-Options "SAMEORIGIN"

  # X-Content-Type-Options: Prevent MIME sniffing
  Header always set X-Content-Type-Options "nosniff"

  # X-XSS-Protection: disabled ("0") per current guidance. The legacy XSS
  # auditor in older browsers could be abused to introduce vulnerabilities;
  # the Content-Security-Policy below is the real XSS defense.
  Header always set X-XSS-Protection "0"

  # Referrer-Policy: Control referrer information
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  # Permissions-Policy: Control browser features
  Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

  # Content-Security-Policy: Prevent XSS, injection attacks.
  # base-uri blocks <base> tag injection; object-src 'none' blocks plugin and
  # embed vectors.
  #
  # Contact form: the form now posts to the self-hosted API at /api/contact,
  # which is SAME-ORIGIN (Caddy proxies /api/* to contact-api on the same
  # https://fluxology.ca origin), so the existing policy already covers both
  # submission paths and needs no new sources:
  #   * hydrated Svelte path — fetch('/api/contact') is covered by
  #     connect-src 'self'
  #   * no-JS path — <form action="/api/contact" method="POST"> is covered by
  #     form-action 'self', as is its 303 redirect to /contact-received/
  # Adding a third-party form endpoint later would require widening BOTH
  # connect-src and form-action; keeping the API same-origin is what lets this
  # stay at 'self'.
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

  # X-Powered-By is stripped if any module sets it. Note: the core Server
  # header cannot be removed by mod_headers (it is added after this runs);
  # ServerTokens/ServerSignature below are the effective controls.
  Header always unset X-Powered-By
</IfModule>

# Limit version disclosure. Set at global scope so it applies even if
# mod_headers is not loaded (Server: Apache, no version; no signature footer).
ServerTokens Prod
ServerSignature Off

# -----------------------------------------------------------------------------
# HSTS — INTENTIONALLY NOT SET HERE. DO NOT ADD IT.
# -----------------------------------------------------------------------------
# Strict-Transport-Security is emitted by Caddy, in the (site-defaults) snippet
# of caddy/Caddyfile, and by nothing else. Exactly one layer must send it:
#
#   * Caddy is the TLS terminator and the only process the browser actually
#     talks to, so it is the layer entitled to assert "this origin is
#     HTTPS-only". Its value applies uniformly to the static site, to /api/*,
#     and to every sub-site that imports the same snippet.
#   * If this file set it too, mod_headers would append a SECOND
#     Strict-Transport-Security header to every static response. Browsers use
#     only the first and ignore the rest, so the two would silently diverge the
#     moment one is edited — and Apache, which never sees the TLS connection,
#     would be the one making a claim it cannot verify.
#
# To change the max-age, add preload, or drop includeSubDomains, edit
# caddy/Caddyfile — one place, one value, all hostnames.

# ==============================================
# ERROR PAGES
# ==============================================

# Branded 404 built by Astro (src/pages/404.astro -> dist/404.html)
ErrorDocument 404 /404.html

# Note: mod_status / server-status monitoring is intentionally not enabled.
# This is a static site with no monitoring consumer, so the module is not
# loaded and no /server-status handler is exposed (reduced attack surface).

# Include virtual host configuration
Include conf/extra/vhost.conf
