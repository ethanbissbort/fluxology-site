<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1B3A4B">
  <title>Offline | Fluxology, Inc.</title>
  <style>
    /* Self-contained on purpose: this page must render with zero network
       requests, so no external fonts, images, or stylesheets. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #1B3A4B;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .card { max-width: 26rem; }
    .brand {
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      line-height: 1.3;
      margin-bottom: 0.75rem;
    }
    p {
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    a.home {
      display: inline-block;
      padding: 0.625rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a.home:hover, a.home:focus { background: rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Fluxology, Inc.</div>
    <h1>You&rsquo;re offline</h1>
    <p>This page isn&rsquo;t available right now because your device has no connection. Reconnect and try again, or head back to a page you&rsquo;ve already visited.</p>
    <a class="home" href="/">Back to home</a>
  </div>
</body>
</html>
