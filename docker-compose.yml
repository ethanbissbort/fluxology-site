services:
  fluxology-web:
    container_name: fluxology-website
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxology-site:latest
    # NOTE: this container serves plaintext HTTP by design. When exposed to
    # an untrusted network it MUST sit behind a TLS terminator (reverse
    # proxy / load balancer) that handles HTTPS, HSTS, and the HTTP->HTTPS
    # redirect. Do not publish it directly to the internet.
    # Apache listens on 6080 inside the container (avoids clashes with other
    # containers, including under host networking).
    ports:
      - "${HTTP_PORT:-6080}:6080"
    environment:
      # Note: only TZ is consumed. Apache's ServerName/ServerAdmin are set in
      # docker/apache/httpd.conf — the old APACHE_SERVER_NAME/ADMIN env vars
      # were never read by anything.
      - TZ=${TIMEZONE:-America/Toronto}
    # Apache logs go to the container's stdout/stderr (see docker/apache/
    # httpd.conf: ErrorLog /proc/self/fd/2, CustomLog /proc/self/fd/1) —
    # use `docker compose logs` to read them. No log bind mount is needed.
    # Mount SSL certificates if needed (optional):
    # volumes:
    #   - ./docker/ssl:/etc/ssl/certs:ro
    networks:
      - fluxology-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.fluxology.description=Fluxology Inc. Corporate Website"
      - "com.fluxology.version=2.0.0"

networks:
  fluxology-network:
    driver: bridge
    name: fluxology-network
