# =============================================================================
# Fluxology — application stack
# =============================================================================
# The VPS edge proxy is intentionally NOT part of this Compose project.
# It runs independently and joins the external `fluxology-edge` Docker network.
#
#   existing VPS edge proxy
#        ├── fluxology-apache:6080
#        ├── fluxology-contact-api:8081
#        └── fluxology-dashboard-api:8082
#
# None of the services below publishes a host port. The edge proxy is the only
# public entrypoint. See docs/CADDY-INTEGRATION.md for the reverse-proxy rules.
# =============================================================================
name: fluxology

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Apache — built static Astro site + isolated dashboard frontends
  # ---------------------------------------------------------------------------
  apache:
    container_name: fluxology-apache
    build:
      context: .
      dockerfile: Dockerfile
    image: fluxology-site:latest
    restart: unless-stopped
    expose:
      - "6080"
    environment:
      - TZ=${TIMEZONE:-America/Toronto}
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    labels:
      - "com.fluxology.description=Fluxology Inc. corporate website and static dashboard shells"
      - "com.fluxology.version=3.0.0"

  # ---------------------------------------------------------------------------
  # Contact form API
  # ---------------------------------------------------------------------------
  contact-api:
    container_name: fluxology-contact-api
    build:
      context: ./services/contact-api
      dockerfile: Dockerfile
    image: fluxology-contact-api:latest
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      - TZ=${TIMEZONE:-America/Toronto}
      - NODE_ENV=production
      - PORT=8081
      - INQUIRY_LOG_PATH=/data/inquiries.jsonl
      - TRUST_PROXY=true
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-5}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-32768}
      - SMTP_HOST
      - SMTP_USER
      - SMTP_PASS
      - MAIL_FROM
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAIL_TO=${MAIL_TO:-info@fluxology.ca}
    volumes:
      - inquiry_data:/data
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8081)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    labels:
      - "com.fluxology.description=Contact form API (JSONL log + optional SMTP)"

  # ---------------------------------------------------------------------------
  # Dashboard API — authoritative live feeds + authenticated direct ingestion
  # ---------------------------------------------------------------------------
  dashboard-api:
    container_name: fluxology-dashboard-api
    build:
      context: .
      dockerfile: services/dashboard-api/Dockerfile
    image: fluxology-dashboard-api:latest
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      - TZ=${TIMEZONE:-America/Toronto}
      - NODE_ENV=production
      - PORT=8082
      - DATA_DIR=/data
      - SEED_DIR=/seed
      - TRUST_PROXY=true
      - MAX_BODY_BYTES=${DASHBOARD_MAX_BODY_BYTES:-1048576}
      - MAX_LISTINGS_PER_WRITE=${DASHBOARD_MAX_LISTINGS_PER_WRITE:-500}
      - OFFICE_INGEST_TOKEN
      - DEALS_INGEST_TOKEN
      - JOBS_INGEST_TOKEN
    volumes:
      - dashboard_data:/data
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8082)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    labels:
      - "com.fluxology.description=Office/deals/jobs live feed and direct-ingest API"

volumes:
  inquiry_data:
  dashboard_data:

networks:
  edge:
    external: true
    name: fluxology-edge
